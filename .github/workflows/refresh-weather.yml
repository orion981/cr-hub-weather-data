name: Refresh weather

on:
  schedule:
    - cron: '7 * * * *'   # hourly, offset to avoid the top-of-hour rush
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch forecast and write weather.json
        run: |
          curl -sS "https://api.open-meteo.com/v1/forecast?latitude=9.98&longitude=-84.17&hourly=temperature_2m,precipitation_probability,weathercode&timezone=America%2FCosta_Rica&forecast_days=6&temperature_unit=fahrenheit" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); json.dump(d['hourly'], open('weather.json','w'), separators=(',',':'))"

      - name: Commit if changed
        run: |
          if git diff --quiet -- weather.json; then
            echo "No change"; exit 0
          fi
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.json
          git commit -m "Refresh weather forecast"
          git push
